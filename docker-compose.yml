# The board. Run it directly with:
#
#   DAKBOARD_DATA=./data docker compose up -d
#
# Then open http://<host>:8099/
#
# The settings page is at /settings

services:
  dakboard:
    build: .
    image: ghcr.io/gosdenj/dakboard:latest
    container_name: dakboard
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      - ${DAKBOARD_DATA:-./data}:/data
    environment:
      - TZ=${TZ:-Europe/London}
      - DAKBOARD_TZ=${DAKBOARD_TZ:-Europe/London}
      - DAKBOARD_PORT=8099
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    cpus: "0.5"
    pids_limit: 100
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/api/health',timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
